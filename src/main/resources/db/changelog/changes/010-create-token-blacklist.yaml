databaseChangeLog:
  - changeSet:
      id: 010-create-token-blacklist
      author: school-api
      changes:
        - sql:
            sql: |
              CREATE TABLE token_blacklist (
               id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
               jti VARCHAR(36) NOT NULL CONSTRAINT uk_blacklist_jti UNIQUE,
               account_id BIGINT NOT NULL CONSTRAINT fk_blacklist_account REFERENCES accounts(id),
               token_type VARCHAR(10) NOT NULL,
               reason VARCHAR(30) NOT NULL,
               expires_at TIMESTAMP WITH TIME ZONE NOT NULL,
               blacklisted_at TIMESTAMP WITH TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP
              );
              CREATE INDEX idx_blacklist_expires_at ON token_blacklist(expires_at);
