databaseChangeLog:
  - changeSet:
      id: 011-create-auth-tokens
      author: school-api
      changes:
        - sql:
            sql: |
              CREATE TABLE auth_tokens (
               id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
               jti VARCHAR(36) NOT NULL CONSTRAINT uk_auth_token_jti UNIQUE,
               session_id VARCHAR(36) NOT NULL,
               token_type VARCHAR(10) NOT NULL,
               account_id BIGINT NOT NULL CONSTRAINT fk_auth_token_account REFERENCES accounts(id),
               issued_at TIMESTAMP WITH TIME ZONE NOT NULL,
               expires_at TIMESTAMP WITH TIME ZONE NOT NULL,
               revoked BOOLEAN NOT NULL DEFAULT FALSE,
               revoked_at TIMESTAMP WITH TIME ZONE,
               revoke_reason VARCHAR(30)
              );
              CREATE INDEX idx_auth_token_session ON auth_tokens(session_id);
              CREATE INDEX idx_auth_token_account_revoked ON auth_tokens(account_id, revoked);
