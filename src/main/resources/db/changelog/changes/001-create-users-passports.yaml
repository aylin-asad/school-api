databaseChangeLog:
  - changeSet:
        id: 001-1
        author: aylin-asad
        preConditions:
        -   onFail: MARK_RAN
        -   not:
            -   tableExists:
                    tableName: users
        changes:
        -   createTable:
                tableName: users
                columns:
                -   column:
                        name: id
                        type: BIGINT
                        autoIncrement: true
                        constraints:
                            nullable: false
                            primaryKey: true
                            primaryKeyName: pk_users
                -   column:
                        name: name
                        type: VARCHAR(50)
                        constraints:
                            nullable: false
                -   column:
                        name: surname
                        type: VARCHAR(50)
                        constraints:
                            nullable: false
                -   column:
                        name: email
                        type: VARCHAR(100)
                        constraints:
                            nullable: false
                -   column:
                        name: gender_id
                        type: INTEGER
                        constraints:
                            nullable: false
  - changeSet:
        id: 001-2
        author: aylin-asad
        changes:
        -   addUniqueConstraint:
                tableName: users
                columnNames: email
                constraintName: uk_user_email
  - changeSet:
        id: 001-3
        author: aylin-asad
        changes:
        -   sql:
                sql: ALTER TABLE users ADD CONSTRAINT chk_users_gender CHECK (gender_id
                    IN (1, 2))
        rollback:
        -   sql:
                sql: ALTER TABLE users DROP CONSTRAINT IF EXISTS chk_users_gender
  - changeSet:
        id: 001-4
        author: aylin-asad
        preConditions:
        -   onFail: MARK_RAN
        -   not:
            -   tableExists:
                    tableName: passports
        changes:
        -   createTable:
                tableName: passports
                columns:
                -   column:
                        name: id
                        type: BIGINT
                        autoIncrement: true
                        constraints:
                            nullable: false
                            primaryKey: true
                            primaryKeyName: pk_passports
                -   column:
                        name: serial_number
                        type: VARCHAR(20)
                        constraints:
                            nullable: false
                -   column:
                        name: issue_date
                        type: DATE
                        constraints:
                            nullable: false
                -   column:
                        name: country
                        type: VARCHAR(50)
                        constraints:
                            nullable: false
                -   column:
                        name: user_id
                        type: BIGINT
                        constraints:
                            nullable: false
  - changeSet:
        id: 001-5
        author: aylin-asad
        changes:
        -   addUniqueConstraint:
                tableName: passports
                columnNames: serial_number
                constraintName: uk_passport_serial
  - changeSet:
        id: 001-6
        author: aylin-asad
        changes:
        -   addUniqueConstraint:
                tableName: passports
                columnNames: user_id
                constraintName: uk_passport_user
  - changeSet:
        id: 001-7
        author: aylin-asad
        changes:
        -   addForeignKeyConstraint:
                baseTableName: passports
                baseColumnNames: user_id
                referencedTableName: users
                referencedColumnNames: id
                constraintName: fk_passport_user
