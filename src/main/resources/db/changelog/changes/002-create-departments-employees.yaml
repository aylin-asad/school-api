databaseChangeLog:
  - changeSet:
        id: 002-1
        author: aylin-asad
        preConditions:
        -   onFail: MARK_RAN
        -   not:
            -   tableExists:
                    tableName: departments
        changes:
        -   createTable:
                tableName: departments
                columns:
                -   column:
                        name: id
                        type: BIGINT
                        autoIncrement: true
                        constraints:
                            nullable: false
                            primaryKey: true
                            primaryKeyName: pk_departments
                -   column:
                        name: name
                        type: VARCHAR(50)
                        constraints:
                            nullable: false
                -   column:
                        name: location
                        type: VARCHAR(100)
                -   column:
                        name: phone
                        type: VARCHAR(20)
  - changeSet:
        id: 002-2
        author: aylin-asad
        changes:
        -   addUniqueConstraint:
                tableName: departments
                columnNames: name
                constraintName: uk_department_name
  - changeSet:
        id: 002-3
        author: aylin-asad
        preConditions:
        -   onFail: MARK_RAN
        -   not:
            -   tableExists:
                    tableName: employees
        changes:
        -   createTable:
                tableName: employees
                columns:
                -   column:
                        name: id
                        type: BIGINT
                        autoIncrement: true
                        constraints:
                            nullable: false
                            primaryKey: true
                            primaryKeyName: pk_employees
                -   column:
                        name: name
                        type: VARCHAR(50)
                        constraints:
                            nullable: false
                -   column:
                        name: surname
                        type: VARCHAR(50)
                        constraints:
                            nullable: false
                -   column:
                        name: salary
                        type: DECIMAL(10,2)
                        constraints:
                            nullable: false
                -   column:
                        name: department_id
                        type: BIGINT
                        constraints:
                            nullable: false
  - changeSet:
        id: 002-4
        author: aylin-asad
        changes:
        -   addForeignKeyConstraint:
                baseTableName: employees
                baseColumnNames: department_id
                referencedTableName: departments
                referencedColumnNames: id
                constraintName: fk_employee_department
  - changeSet:
        id: 002-5
        author: aylin-asad
        changes:
        -   sql:
                sql: ALTER TABLE employees ADD CONSTRAINT chk_employee_salary CHECK (salary
                    > 0)
        rollback:
        -   sql:
                sql: ALTER TABLE employees DROP CONSTRAINT IF EXISTS chk_employee_salary
